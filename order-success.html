<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Successful | Farrah Kiddies</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .success-page {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }
        .success-box {
            background: white;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.08);
            max-width: 500px;
            width: 100%;
        }
        .success-icon {
            width: 90px;
            height: 90px;
            background: #dcfce7;
            color: #16a34a;
            font-size: 2.5rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
        }
        .success-box h1 {
            font-size: 1.8rem;
            margin-bottom: 12px;
            color: #16a34a;
        }
        .success-box p {
            color: #64748b;
            margin-bottom: 8px;
            line-height: 1.6;
        }
        .order-id {
            background: #fdf2f8;
            color: #db2777;
            padding: 8px 18px;
            border-radius: 30px;
            font-weight: 600;
            display: inline-block;
            margin: 20px 0;
        }
        .success-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        .btn-success {
            padding: 13px 28px;
            border-radius: 10px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary-success {
            background: #db2777;
            color: white;
        }
        .btn-outline-success {
            background: #f1f5f9;
            color: #334155;
        }
    </style>
</head>
<body>

    <div class="success-page">
        <div class="success-box">
            <div class="success-icon">
                <i class="fas fa-check"></i>
            </div>
            <h1>Order Placed Successfully!</h1>
            <p>Thank you for shopping with Farrah Kiddies.</p>
            <p>We have received your order and will contact you shortly on WhatsApp.</p>

            <div class="order-id" id="orderIdDisplay">
                Order ID: Loading...
            </div>

            <div class="success-actions">
                <a href="index.html" class="btn-success btn-primary-success">
                    Continue Shopping
                </a>
                <a href="index.html" class="btn-success btn-outline-success">
                    Back to Home
                </a>
            </div>
        </div>
    </div>

    <script>
        // Get order ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('id');

        if (orderId) {
            document.getElementById('orderIdDisplay').textContent = `Order ID: #${orderId}`;
        } else {
            document.getElementById('orderIdDisplay').textContent = `Order ID: Not found`;
        }
    </script>
</body>
</html>
