<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Successful | Farrah Kiddies</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .success-page {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }
        .success-box {
            background: white;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.08);
            max-width: 500px;
            width: 100%;
        }
        .success-icon {
            width: 90px;
            height: 90px;
            background: #dcfce7;
            color: #16a34a;
            font-size: 2.5rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
        }
        .success-box h1 {
            font-size: 1.8rem;
            margin-bottom: 12px;
            color: #16a34a;
        }
        .success-box p {
            color: #64748b;
            margin-bottom: 8px;
            line-height: 1.6;
        }
        .order-id {
            background: #fdf2f8;
            color: #db2777;
            padding: 8px 18px;
            border-radius: 30px;
            font-weight: 600;
            display: inline-block;
            margin: 20px 0;
        }
        .success-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        .btn-success {
            padding: 13px 28px;
            border-radius: 10px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary-success {
            background: #db2777;
            color: white;
        }
        .btn-outline-success {
            background: #f1f5f9;
            color: #334155;
        }

        /* ===== PAGE LOADER ===== */
.page-loader {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #fdf2f8; /* soft pink background */
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 99999;
    opacity: 0;
    visibility: hidden;
    transition: all 0.4s ease;
}

.page-loader.active {
    opacity: 1;
    visibility: visible;
}

.loader-content img {
    text-align: center;
     width:50px;
  height:50px;
  border-radius:50%;
  /* background: #e91e8c; */
}

.loader-logo img {
     width:50px;
  height:50px;
  border-radius:50%;
  /* background: #e91e8c; */
    /* font-size: 1.8rem;
    font-weight: 700;
    color: #831843;
    margin-bottom: 25px;
    letter-spacing: -0.5px; */
}

.loader-logo span {
    color: #db2777;
}

.loader-spinner {
    width: 48px;
    height: 48px;
    border: 4px solid #fbcfe8;
    border-top: 4px solid #db2777;
    border-radius: 50%;
    animation: spin 0.75s linear infinite;
    margin: 0 auto;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
    </style>
</head>
<body>

    <div class="success-page">
        <div class="success-box">
            <div class="success-icon">
                <i class="fas fa-check"></i>
            </div>
            <h1>Order Placed Successfully!</h1>
            <p>Thank you for shopping with Farrah Kiddies.</p>
            <p>We have received your order and will contact you shortly on WhatsApp.</p>

            <div class="order-id" id="orderIdDisplay">
                Order ID: Loading...
            </div>

            <div class="success-actions">
                <a href="index.html" class="btn-success btn-primary-success">
                    Continue Shopping
                </a>
                <a href="index.html" class="btn-success btn-outline-success">
                    Back to Home
                </a>
            </div>
        </div>
    </div>
<!-- Page Loading Spinner -->
<div id="pageLoader" class="page-loader">
    <div class="loader-content">
        <div class="loader-logo"><img src="images/logo.jpeg" alt="logo"></div>
        <div class="loader-spinner"></div>
    </div>
</div>
    <script>
        // Get order ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('id');

        if (orderId) {
            document.getElementById('orderIdDisplay').textContent = `Order ID: #${orderId}`;
        } else {
            document.getElementById('orderIdDisplay').textContent = `Order ID: Not found`;
        }

        // Page Loader
const pageLoader = document.getElementById('pageLoader');

// Show loader when clicking internal links
document.querySelectorAll('a').forEach(link => {
    link.addEventListener('click', function(e) {
        const href = this.getAttribute('href');

        // Only show loader for internal page links
        if (href && !href.startsWith('#') && !href.startsWith('http') && !href.startsWith('mailto') && !href.startsWith('tel')) {
            pageLoader.classList.add('active');
        }
    });
});

// Hide loader when page is fully loaded
window.addEventListener('load', () => {
    setTimeout(() => {
 pageLoader.classList.remove('active');
    }, 300);
});
    </script>
</body>
</html>
